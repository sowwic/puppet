[project]
name = "puppet"
version = "0.0.1"
description = "Description"
authors = [
    {name = "Dima Shevchenko",email = "47799401+sowwic@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
packages = [
    {include = "puppet", from="src"},
]
dependencies = [
]

[build-system]
requires = ["uv_build>=0.10.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "puppet"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "maya-stubs",
    "pyside6",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-autorefs",
    "mkdocs-autoapi",
    "ruff",
    "debugpy",
]
# Installed into the temporary Maya module by mayapy_test.sh
maya-pytest = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
]

[tool.ruff]
src = ["src"]
exclude = ["**/resources_rc.py"]

show-fixes = true
line-length = 89
lint.select = [
    "E",
    "F",
    "UP",
]
lint.ignore = [
    "D100",
    "D104",
    "D103",
]

[tool.pytest.ini_options]
addopts = "--cov=puppet --cov-report=term-missing"
log_cli = true
log_cli_level = "ERROR"

[tool.ty.rules]
unresolved-attribute="ignore"
invalid-argument-type="ignore"
invalid-assignment="ignore"
invalid-return-type="ignore"
invalid-method-override="ignore"
