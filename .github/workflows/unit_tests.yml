name: Tests

on:
  push:

jobs:
  unit-tests:
    runs-on: [self-hosted, macOS, ARM64, maya-2026]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest tests
